info:
  name: List loan requests visible to the current staff member
  type: http
  seq: 1
  tags:
    - Loan_requests

http:
  method: GET
  url: "{{baseUrl}}/loan-requests"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/loan-requests"
      method: GET
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "studentId": "",
                "advisorId": "",
                "amount": 0,
                "approvedAmount": 0,
                "studentYear": 0,
                "purpose": "",
                "additionalNote": "",
                "installmentCount": 0,
                "firstDueDate": "",
                "status": "draft",
                "submittedAt": "",
                "cancelledAt": "",
                "cancelledBy": "",
                "disbursedAt": "",
                "closedAt": "",
                "createdAt": "",
                "updatedAt": "",
                "student": {
