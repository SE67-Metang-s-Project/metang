  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/loan-requests"
      method: GET
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": ""
            }
          }
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/loan-requests"
      method: GET
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
