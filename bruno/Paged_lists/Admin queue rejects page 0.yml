info:
  name: Admin queue rejects page 0
  type: http
  seq: 12
  tags:
    - Paged_lists

http:
  method: GET
  url: "{{baseUrl}}/admin/queue?page=0"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.error.code
      operator: eq
      value: "VALIDATION_ERROR"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
