info:
  name: Admin disburse-debt rejects an unknown degree
  type: http
  seq: 15
  tags:
    - Paged_lists

http:
  method: GET
  url: "{{baseUrl}}/admin/disburse-debt?degree=toString"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.error.code
      operator: eq
      value: "VALIDATION_ERROR"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
