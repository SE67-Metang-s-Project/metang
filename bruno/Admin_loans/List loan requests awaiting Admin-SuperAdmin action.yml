info:
  name: List loan requests awaiting Admin/SuperAdmin action
  type: http
  seq: 1
  tags:
    - Admin_loans

http:
  method: GET
  url: "{{baseUrl}}/admin/loan-requests"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  params:
    - name: status
      value: pending_admin
      type: query
      disabled: true
    - name: status
      value: pending_disbursement
      type: query
      disabled: true
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isDefined
    - expression: res.body.error
      operator: isUndefined
  scripts:
    - type: after-response
      code: |-
        // Chained into the detail request below (seq 2) as a path param.
        bru.setVar("adminLoanId", res.body.data?.[0]?.id ?? "");
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/admin/loan-requests"
      method: GET
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
      params:
        - name: status
          value: pending_admin
          type: query
          disabled: true
        - name: status
          value: pending_disbursement
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "studentId": "",
                "advisorId": "",
                "amount": 0,
                "approvedAmount": 0,
                "studentYear": 0,
                "purpose": "",
