info:
  name: 17 SuperAdmin role rules - self, final, executive, staff removal
  type: http
  seq: 17
  tags:
    - Workflow

http:
  method: GET
  url: "{{baseUrl}}/super-admin/users"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        // Runs last: it removes staff and renames the executive, which no earlier step may
        // see. The dev bypass acts as SuperAdmin ...0002, the only SuperAdmin in the seed.
        const base = bru.interpolate("{{baseUrl}}") + "/super-admin/users";
        const U = (n) => "00000000-0000-0000-0000-" + String(n).padStart(12, "0");
        const statusOf = (r) => r?.status ?? r?.response?.status ?? 0;
        // A rejected sendRequest (4xx) carries only the status, never the body, so 4xx checks are
        // status-only; the error codes are pinned in tests/superadmin-user-roles-management.test.ts.
        const bodyOf = (r) => r?.data ?? r?.response?.data ?? {};
        const call = (method, path, data) =>
          bru
            .sendRequest({ method, url: base + path, headers: { "Content-Type": "application/json" }, data })
            .catch((error) => error)
            .then((r) => ({ status: statusOf(r), body: bodyOf(r) }));
        const role = (n, action, roleName) => call("POST", `/${U(n)}/roles`, { action, role: roleName });

        const selfDelete = await call("DELETE", `/${U(2)}`);
        const selfDemote = await role(2, "remove", "super_admin");
        test("a SuperAdmin can neither delete nor demote themself", function () {
          expect(selfDelete.status).to.equal(409);
          expect(selfDemote.status).to.equal(409);
        });

        const promote = await role(3, "grant", "super_admin");
        const selfDemoteWithTwo = await role(2, "remove", "super_admin");
        const successorRemoves = await role(3, "remove", "super_admin");
        test("a second SuperAdmin doesn't unlock self-demotion; removing the other one works", function () {
          expect(promote.status).to.equal(200);
          expect(selfDemoteWithTwo.status).to.equal(409);
          expect(successorRemoves.status).to.equal(200);
        });

        const removeExecutive = await role(1, "remove", "executive");
        const deleteExecutive = await call("DELETE", `/${U(1)}`);
        const editAdvisor = await call("PATCH", `/${U(7)}`, { fullNameTh: "x", email: "x@cmu.ac.th" });
        test("the executive is never removed or deleted, and only the executive is editable", function () {
          expect(removeExecutive.status).to.equal(409);
          expect(deleteExecutive.status).to.equal(400);
          expect(editAdvisor.status).to.equal(409);
        });

        // Admin 8 has hundreds of seeded approvals and payouts: the row must stay, only the role goes.
        const deleteAdmin = await call("DELETE", `/${U(8)}`);
        const list = await call("GET", "");
        const admin8 = (list.body.data?.users ?? []).find((u) => u.id === U(8));
        test("an admin with history is removed: 200, row kept, no admin role", function () {
          expect(deleteAdmin.status).to.equal(200);
          expect(deleteAdmin.body.data.rowDeleted).to.equal(false);
          expect(admin8).to.not.equal(undefined);
          expect(admin8.roles.map((r) => r.role)).to.not.include("admin");
        });

        // An address that already belongs to another user is refused: nobody is handed the role.
        const taken = (list.body.data?.users ?? []).find((u) => u.id !== U(1) && /@cmu\.ac\.th$/i.test(u.email ?? ""));
        const refused = await call("PATCH", `/${U(1)}`, { fullNameTh: "ผู้บริหาร", email: taken?.email });
        test("an email already in use is refused with 409 and the executive stays", function () {
          expect(taken).to.not.equal(undefined);
          expect(refused.status).to.equal(409);
        });

        // Add never renames anyone or hands a role to someone holding one: advisor 7 is refused.
        // Admin 8, removed above (row kept for their history, no roles left), is rehired on the
        // same row with their recorded name.
        const advisor7 = (list.body.data?.users ?? []).find((u) => u.id === U(7));
        const addAdvisor = await call("POST", "", { fullNameTh: "ชื่อ ทับ", email: advisor7?.email, role: "admin" });
        const rehire = await call("POST", "", { fullNameTh: "ชื่อ ทับ", email: admin8?.email, role: "admin" });
        const after = await call("GET", "");
        const advisor7After = (after.body.data?.users ?? []).find((u) => u.id === U(7));
        test("adding someone who holds a role is refused with 409 and nobody is renamed", function () {
          expect(addAdvisor.status).to.equal(409);
          expect(advisor7After.fullNameTh).to.equal(advisor7.fullNameTh);
          expect(advisor7After.roles.map((r) => r.role)).to.not.include("admin");
        });
        test("adding a removed admin rehires them on the same row, name unchanged", function () {
          expect(rehire.status).to.equal(200);
          expect(rehire.body.data.id).to.equal(U(8));
          expect(rehire.body.data.fullNameTh).to.equal(admin8.fullNameTh);
          expect(rehire.body.data.roles.map((r) => r.role)).to.include("admin");
        });

        // An advisor is never also admin or SuperAdmin, and the reverse.
        const advisorToAdmin = await role(7, "grant", "admin");
        const adminToAdvisor = await role(8, "grant", "advisor");
        test("advisor and admin roles never combine", function () {
          expect(advisorToAdmin.status).to.equal(409);
          expect(adminToAdvisor.status).to.equal(409);
        });

        // An admin nothing names yet is really deleted, so the same email can be added again.
        const fresh = { fullNameTh: "แอดมิน ชั่วคราว", email: "temp.admin.wf17@cmu.ac.th", role: "admin" };
        const added = await call("POST", "", fresh);
        const freshId = added.body.data?.id;
        const deleteFresh = await call("DELETE", `/${freshId}`);
        const gone = await call("GET", "");
        const readded = await call("POST", "", fresh);
        test("an admin without history is deleted for real and can be added again", function () {
          expect(added.status).to.equal(200);
          expect(deleteFresh.status).to.equal(200);
          expect(deleteFresh.body.data.rowDeleted).to.equal(true);
          expect((gone.body.data?.users ?? []).some((u) => u.id === freshId)).to.equal(false);
          expect(readded.status).to.equal(200);
          expect(readded.body.data.id).to.not.equal(freshId);
        });

        // A new email edits the same row: the id, roles and history stay with it.
        const replaced = await call("PATCH", `/${U(1)}`, { fullNameTh: "ผู้บริหาร คนใหม่", email: "new.executive@cmu.ac.th" });
        test("a new email edits the executive in place: same id, roles kept", function () {
          expect(replaced.status).to.equal(200);
          expect(replaced.body.data.id).to.equal(U(1));
          expect(replaced.body.data.email).to.equal("new.executive@cmu.ac.th");
          expect(replaced.body.data.roles.map((r) => r.role)).to.include.members(["executive", "advisor"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0

docs: |-
  The user-management rules: at least one SuperAdmin, none can remove themself (a successor
  removes them), exactly one executive whose name and email are edited in place, and staff
  removal that hands open loans to the remover, then deletes the user row unless past work
  names them (then only the roles go).
