info:
  name: 08_1 executive returns for a smaller amount
  type: http
  seq: 8
  tags:
    - Workflow

http:
  method: POST
  url: "{{baseUrl}}/executive/loan-requests/{{walkLoanId}}/decision"
  body:
    type: json
    data: |-
      {
        "decision": "returned",
        "comment": "ขอให้ปรับลดวงเงินอีกครั้ง"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.status
      operator: eq
      value: "pending_admin"
  scripts:
    - type: before-request
      code: |-
        // The walk degrades instead of cascading when an earlier step failed to produce an id.
        if (!bru.getVar("walkLoanId")) bru.runner.skipRequest();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0

docs: |-
  An executive return only asks the admin to change the amount; the admin handles it.
