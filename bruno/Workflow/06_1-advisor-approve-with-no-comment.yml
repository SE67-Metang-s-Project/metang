info:
  name: 06 advisor approves with no comment
  type: http
  seq: 6
  tags:
    - Workflow

http:
  method: POST
  url: "{{baseUrl}}/advisor/loan-requests/{{walkLoanId}}/decision"
  body:
    type: json
    data: |-
      {
        "decision": "approved",
        "comment": null
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // The walk degrades instead of cascading when an earlier step failed to produce an id.
        if (!bru.getVar("walkLoanId")) bru.runner.skipRequest();
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.error.code
      operator: eq
      value: "VALIDATION_ERROR"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
