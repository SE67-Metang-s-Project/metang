info:
  name: 09_2 a loan awaiting disbursement cannot be cancelled
  type: http
  seq: 9
  tags:
    - Workflow

http:
  method: POST
  url: "{{baseUrl}}/student/loan-requests/{{walkLoanId}}/cancel"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.error.code
      operator: eq
      value: "CONFLICT"
  scripts:
    - type: before-request
      code: |-
        // The walk degrades instead of cascading when an earlier step failed to produce an id.
        if (!bru.getVar("walkLoanId")) bru.runner.skipRequest();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0

docs: |-
  Step 09 left the walk loan pending_disbursement. The admin may already be sending the
  transfer, so the student can no longer cancel it.
