info:
  name: Submit a student loan request
  type: http
  seq: 3
  tags:
    - Student_loans

http:
  method: POST
  url: "{{baseUrl}}/student/loan-requests"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "advisorName": "อาจารย์ที่ปรึกษา ทดสอบ",
        "amount": 5000,
        "studentYear": 2,
        "purpose": "ค่าใช้จ่ายฉุกเฉิน",
        "additionalNote": "ค่าใช้จ่ายสำหรับอุปกรณ์การเรียน",
        "bankName": "ธนาคารกรุงไทย",
        "bankAccountNo": "1234567890",
        "bankAccountName": "นักศึกษาทดสอบ",
        "installmentCount": 1
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

