info:
  name: Cancel the current student's active loan request
  type: http
  seq: 6
  tags:
    - Student_loans

http:
  method: POST
  url: "{{baseUrl}}/student/loan-requests/:id/cancel"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  params:
    - name: id
      value: REQ202609060000
      type: path
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

