info:
  name: List loan requests awaiting the current advisor's decision
  type: http
  seq: 1
  tags:
    - Advisor_loans

http:
  method: GET
  url: "{{baseUrl}}/advisor/loan-requests"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isDefined
    - expression: res.body.error
      operator: isUndefined
  scripts:
    - type: after-response
      code: |-
        // Chained into the detail request below (seq 2) as a path param.
        bru.setVar("advisorLoanId", res.body.data?.[0]?.id ?? "");
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/advisor/loan-requests"
      method: GET
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "",
                "studentId": "",
                "advisorId": "",
                "amount": 0,
                "approvedAmount": 0,
                "studentYear": 0,
                "purpose": "",
                "additionalNote": "",
                "installmentCount": 0,
                "firstDueDate": "",
                "status": "draft",
                "submittedAt": "",
                "cancelledAt": "",
                "cancelledBy": "",
                "disbursedAt": "",
                "closedAt": "",
                "createdAt": "",
                "updatedAt": "",
                "student": {
                  "id": "",
                  "studentCode": "",
                  "fullNameTh": "",
                  "fullNameEn": ""
                },
                "approvals": [
                  {
                    "id": "",
                    "loanId": "",
                    "step": "advisor",
                    "attempt": 0,
                    "decision": "pending",
                    "decidedBy": "",
                    "decidedAt": "",
                    "comment": "",
                    "decider": {
                      "id": "",
                      "fullNameTh": "",
                      "fullNameEn": ""
                    }
                  }
                ]
              }
            ]
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/advisor/loan-requests"
      method: GET
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "",
              "message": ""
            }
          }
