info:
  name: Grant or remove a predefined role for an application user
  type: http
  seq: 2
  tags:
    - SuperAdmin_roles

http:
  method: POST
  url: "{{baseUrl}}/super-admin/users/:id/roles"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  params:
    - name: id
      value: "00000000-0000-0000-0000-000000000102"
      type: path
  body:
    type: json
    data: |-
      {
        "action": "grant",
        "role": "advisor"
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.roles
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

