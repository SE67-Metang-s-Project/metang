info:
  name: "Add a user: the English name is required"
  type: http
  seq: 6
  tags:
    - SuperAdmin_roles

http:
  method: POST
  url: "{{baseUrl}}/super-admin/users"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "fullNameTh": "ไม่มี ชื่ออังกฤษ",
        "fullNameEn": "   ",
        "email": "no.english.name@cmu.ac.th",
        "role": "admin"
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.error.message
      operator: eq
      value: กรุณาระบุชื่อ-นามสกุลภาษาอังกฤษ

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
