info:
  name: "Add a user: an address outside CMU is refused"
  type: http
  seq: 3
  tags:
    - SuperAdmin_roles

http:
  method: POST
  url: "{{baseUrl}}/super-admin/users"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "fullNameTh": "Not A CMU Person",
        "email": "someone@gmail.com",
        "role": "admin"
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.error.code
      operator: eq
      value: VALIDATION_ERROR

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
