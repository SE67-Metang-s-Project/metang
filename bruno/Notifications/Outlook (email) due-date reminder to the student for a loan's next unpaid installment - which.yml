info:
  name: Outlook (email) due-date reminder to the student for a loan's next unpaid installment - which
  type: http
  seq: 2
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/notifications/outlook"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "loanId": ""
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

