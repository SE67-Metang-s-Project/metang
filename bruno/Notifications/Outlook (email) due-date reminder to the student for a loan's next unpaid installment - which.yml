  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/notifications/outlook"
      method: POST
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "loanId": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "loanId": "",
              "installmentSeq": 0,
              "amountDue": 0,
              "dueDate": "",
              "sentTo": ""
