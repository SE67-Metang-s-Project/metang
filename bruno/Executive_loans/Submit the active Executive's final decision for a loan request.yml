info:
  name: Submit the active Executive's final decision for a loan request
  type: http
  seq: 3
  tags:
    - Executive_loans

http:
  method: POST
  url: "{{baseUrl}}/executive/loan-requests/:id/decision"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  params:
    - name: id
      value: "REQ202609060005"
      type: path
  body:
    type: json
    data: |-
      {
        "decision": "approved"
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.status
      operator: eq
      value: "pending_disbursement"
    - expression: res.body.error
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

