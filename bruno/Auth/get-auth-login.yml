  url: "{{baseUrl}}/auth/login"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "307"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: true
