info:
  name: Record a manual fund transaction (top-up, withdrawal, or adjustment)
  type: http
  seq: 2
  tags:
    - SuperAdmin_fund

http:
  method: POST
  url: "{{baseUrl}}/super-admin/fund-transactions"
  headers:
    - name: cmu_session
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "kind": "top_up",
        "amount": 1000
      }
  auth:
    type: apikey
    key: cmu_session
    value: "{{apiKey}}"
    placement: header

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.kind
      operator: eq
      value: "top_up"
    - expression: res.body.data.amount
      operator: eq
      value: "1000"
    - expression: res.body.data.direction
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/super-admin/fund-transactions"
      method: POST
      headers:
        - name: cmu_session
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "kind": "top_up",
            "amount": 0,
            "note": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "",
              "kind": "top_up",
              "amount": 0,
              "direction": 1,
              "loanId": "",
              "performedBy": "",
              "slipPath": "",
              "note": "",
              "createdAt": ""
            }
          }
